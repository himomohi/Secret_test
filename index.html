<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Vampire Survivors Clone - Pixel Edition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background: #1a1a1a;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            position: fixed;
        }

        #gameContainer {
            position: relative;
            background: #000;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.3);
            width: 100%;
            height: 100%;
            max-width: 100vw;
            max-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #gameCanvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .ui-overlay > * {
            pointer-events: auto;
        }

        /* 가상 조이스틱 스타일 */
        #virtualJoystick {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 150px;
            height: 150px;
            background: rgba(68, 68, 68, 0.4);
            border-radius: 50%;
            border: 3px solid rgba(68, 255, 68, 0.6);
            display: none;
            touch-action: none;
        }

        #virtualJoystick.active {
            display: block;
        }

        #joystickKnob {
            position: absolute;
            width: 60px;
            height: 60px;
            background: rgba(68, 255, 68, 0.8);
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.8);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transition: none;
        }

        /* 모바일 버튼 */
        #mobileButtons {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: none;
            flex-direction: column;
            gap: 10px;
        }

        #mobileButtons.active {
            display: flex;
        }

        .mobile-btn {
            width: 60px;
            height: 60px;
            background: rgba(68, 68, 255, 0.7);
            border: 3px solid rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            color: white;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            touch-action: none;
            cursor: pointer;
        }

        .mobile-btn:active {
            background: rgba(68, 68, 255, 1);
            transform: scale(0.95);
        }

        /* 모바일 최적화 */
        @media (max-width: 768px) {
            #virtualJoystick.active,
            #mobileButtons.active {
                display: flex;
            }
        }

        @media (orientation: landscape) and (max-height: 500px) {
            #virtualJoystick {
                width: 100px;
                height: 100px;
                bottom: 10px;
                left: 10px;
            }

            #joystickKnob {
                width: 40px;
                height: 40px;
            }

            #mobileButtons {
                bottom: 10px;
                right: 10px;
            }

            .mobile-btn {
                width: 50px;
                height: 50px;
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <div id="uiOverlay" class="ui-overlay"></div>

        <!-- 가상 조이스틱 -->
        <div id="virtualJoystick">
            <div id="joystickKnob"></div>
        </div>

        <!-- 모바일 버튼 -->
        <div id="mobileButtons">
            <button class="mobile-btn" id="pauseBtn">⏸</button>
        </div>
    </div>

    <!-- Core Engine -->
    <script src="src/engine/PixelArtRenderer.js"></script>
    <script src="src/engine/GameEngine.js"></script>
    <script src="src/engine/Renderer.js"></script>
    <script src="src/engine/InputManager.js"></script>
    <script src="src/engine/Camera.js"></script>

    <!-- Data -->
    <script src="src/data/characters.js"></script>
    <script src="src/data/skills.js"></script>
    <script src="src/data/items.js"></script>
    <script src="src/data/enemies.js"></script>

    <!-- Systems -->
    <script src="src/systems/MapGenerator.js"></script>
    <script src="src/systems/SkillSystem.js"></script>
    <script src="src/systems/ItemSystem.js"></script>
    <script src="src/systems/SpawnSystem.js"></script>
    <script src="src/systems/SaveSystem.js"></script>
    <script src="src/systems/CollisionSystem.js"></script>

    <!-- Entities -->
    <script src="src/entities/Entity.js"></script>
    <script src="src/entities/Player.js"></script>
    <script src="src/entities/Enemy.js"></script>
    <script src="src/entities/Projectile.js"></script>
    <script src="src/entities/Item.js"></script>

    <!-- UI -->
    <script src="src/ui/UIManager.js"></script>
    <script src="src/ui/MainMenu.js"></script>
    <script src="src/ui/CharacterSelect.js"></script>
    <script src="src/ui/GameHUD.js"></script>
    <script src="src/ui/LevelUpMenu.js"></script>

    <!-- Main -->
    <script src="src/main.js"></script>
</body>
</html>
